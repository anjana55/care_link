# Shared application routing, mounted into every server block.
#
# This file is included by BOTH deploy/nginx.conf (plain HTTP) and
# deploy/nginx.https.conf (HTTPS). Keeping the proxying rules here means
# the two configs cannot drift apart - they differ only in TLS
# termination, not in how requests reach the apps. Editing routing in one
# place updates both.
#
# Mounted at /etc/nginx/snippets/proxy-locations.conf.

# ---------- Public Next.js (root) ----------
# This serves both the landing page ("/") and the finder (/find). The
# landing used to be a static file pinned here with `location = /`, which
# shadowed the app's own "/" route: a stale copy of that file could be
# served while the app behind it had already moved on (see the note in
# setup.sh about a deploy that did exactly that). The landing page is a
# route in the app now, so there is nothing to shadow.
location / {
    proxy_pass http://public-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # `$scheme` is whatever this server block is listening on, so this is
    # `http` in the plain config and `https` in the TLS one - which is what
    # makes the apps build absolute URLs correctly and stops Next.js
    # redirecting a form POST back to the wrong scheme.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Staff / Internal Next.js
location /staff {
    proxy_pass http://web:3000/staff;          # no trailing slash here
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# ---------- NestJS API ----------
location /api/ {
    # nginx's default body limit is 1MB, while the API accepts uploads up
    # to STORAGE_MAX_FILE_SIZE_BYTES (10MB). Without this, a caregiver
    # document over 1MB was rejected here with a bare 413 before it ever
    # reached the API - the same request sent straight to the API
    # succeeds. Kept above the API's own limit deliberately: nginx is the
    # outer gate, and the API re-validates size and MIME type itself, so
    # the tighter limit is enforced where the validation lives.
    client_max_body_size 12m;

    # Strip the /api prefix. This API sets no global prefix
    # (no setGlobalPrefix in apps/api/src/main.ts), so Nest serves its
    # routes at /locations, /auth/login, etc. Forwarding the prefix on
    # made every API call 404 - the browser saw "Cannot GET
    # /api/locations" while React Query swallowed it as empty data, so
    # the district/city dropdowns just rendered blank with no visible
    # error. The trailing slash on proxy_pass is what strips the prefix.
    #
    # Because of that strip, a route on the API must NOT repeat "api" in
    # its own path. Swagger used to be mounted at "api/docs", which is why
    # /api/docs 404'd and only the double-prefixed /api/api/docs worked;
    # it is mounted at "docs" now, so the docs are at /api/docs as
    # expected.
    proxy_pass http://api:3001/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# optional: /api without trailing slash
location = /api {
    return 301 /api/;
}
