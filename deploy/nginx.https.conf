# HTTPS reverse proxy - what nginx serves once a certificate exists.
#
# setup.sh copies this file to deploy/nginx.local.conf with the real
# domain substituted for __DOMAIN__ and switches the nginx service to
# mount it (see the NGINX_CONF variable in docker-compose.prod.yml).
# The committed copy keeps __DOMAIN__ as a placeholder so the file stays
# free of any one deployment's domain.
#
# nginx will NOT start if the files named in ssl_certificate are absent,
# which is why deploy/nginx.conf exists as a certificate-free default.
#
# The routing lives in deploy/proxy-locations.conf, shared with the HTTP
# config so the two can't drift apart.

# ---------- Port 80: ACME challenges, and a redirect to HTTPS ----------
server {
    listen 80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Port 443: the real application ----------
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # OCSP stapling. Lets the browser check revocation without a round
    # trip to the CA, and takes the CA out of the hot path for every
    # visitor. Needs a resolver at runtime, hence the `resolver` line -
    # without it nginx fails to start when it tries to staple.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=300s;   # Docker's embedded DNS
    resolver_timeout 5s;

    # certbot's defaults are already modern (TLS 1.2+). These are the two
    # settings worth being explicit about: only forward-secret ciphers, and
    # prefer the AEAD suites. `ssl_prefer_server_ciphers off` lets the
    # client's own ordering win where it is better - on modern clients that
    # is faster (ChaCha20 on mobile, AES-NI on desktop).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # HSTS. Tells browsers to refuse to talk to this host over plain HTTP
    # for a year. Safe only because TLS is fully wired up here - do not
    # enable it while still bootstrapping, or a mistake locks out every
    # visitor until the header ages out. `preload` is left off: submitting
    # a domain to the browser preload list is effectively irreversible and
    # is not something to opt into by accident.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/proxy-locations.conf;
}
