# Production reverse proxy - HTTP entry point and TLS terminator.
#
# TLS is terminated here, inside the container, from a certificate that the
# `certbot` service in docker-compose.prod.yml writes into the shared
# `certbot-conf` volume. Renewal happens in that container; this file only has
# to point at the resulting files and reload when they change.
#
# REPLACE every occurrence of `yourdomain.example` with your real domain
# before starting. It appears in `server_name` and in the two
# `ssl_certificate` paths - the paths are keyed by domain name because
# certbot lays out /etc/letsencrypt/live/<domain>/.
#
# See DEPLOYMENT.md Part 13 for the full walkthrough, including the
# bootstrap order (a certificate has to exist before the 443 server block
# below will start - nginx refuses to load if the files it is told to read
# are missing).

# ---------- Port 80: ACME challenges, and a redirect to HTTPS ----------
server {
    listen 80;
    server_name yourdomain.example;

    # Let's Encrypt's HTTP-01 challenge. This location must stay reachable
    # over plain HTTP even though everything else redirects to HTTPS -
    # renewal happens against port 80 by definition, so a blanket redirect
    # above it would break renewals roughly every 60 days. `^~` so this
    # prefix wins over any regex location that might otherwise match.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Port 443: the real application ----------
server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.example/privkey.pem;

    # OCSP stapling. Lets the browser check revocation without a round trip
    # to the CA, and takes the certificate's authority out of the hot path
    # for every visitor. Requires a resolver at runtime, hence the
    # `resolver` line in the http-level config - without it nginx fails to
    # start when it tries to staple.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=300s;   # Docker's embedded DNS
    resolver_timeout 5s;

    # certbot's defaults are already modern (TLS 1.2+). These are the two
    # settings worth being explicit about: only forward-secret ciphers, and
    # prefer the AEAD suites. `ssl_prefer_server_ciphers off` lets the
    # client's own ordering win where it is better - on modern clients that
    # is faster (ChaCha20 on mobile, AES-NI on desktop).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # HSTS. Tells browsers to refuse to talk to this host over plain HTTP
    # for a year. Safe only because TLS is fully wired up here - do not
    # enable it while you are still bootstrapping, or a mistake will lock
    # out every visitor until the header ages out. `preload` is left off:
    # submitting a domain to the browser preload list is effectively
    # irreversible and is not something to opt into by accident.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- Public Next.js (root) ----------
    # This serves both the landing page ("/") and the finder (/find). The
    # landing used to be a static file pinned here with `location = /`, which
    # shadowed the app's own "/" route: a stale copy of that file could be
    # served while the app behind it had already moved on (see the note in
    # setup.sh about a deploy that did exactly that). The landing page is a
    # route in the app now, so there is nothing to shadow.
    location / {
        proxy_pass http://public-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # `$scheme` is https on this server block, which is what makes the
        # apps build absolute URLs against https and what stops Next.js
        # from redirecting a form POST back to http.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

# Staff / Internal Next.js
location /staff {
    proxy_pass http://web:3000/staff;          # no trailing slash here
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

    # ---------- NestJS API ----------
    location /api/ {
        # nginx's default body limit is 1MB, while the API accepts uploads up
        # to STORAGE_MAX_FILE_SIZE_BYTES (10MB). Without this, a caregiver
        # document over 1MB was rejected here with a bare 413 before it ever
        # reached the API - the same request sent straight to the API
        # succeeds. Kept above the API's own limit deliberately: nginx is the
        # outer gate, and the API re-validates size and MIME type itself, so
        # the tighter limit is enforced where the validation lives.
        client_max_body_size 12m;

        # Strip the /api prefix. This API sets no global prefix
        # (no setGlobalPrefix in apps/api/src/main.ts), so Nest serves its
        # routes at /locations, /auth/login, etc. Forwarding the prefix on
        # made every API call 404 - the browser saw "Cannot GET
        # /api/locations" while React Query swallowed it as empty data, so
        # the district/city dropdowns just rendered blank with no visible
        # error. The trailing slash on proxy_pass is what strips the prefix.
        #
        # Because of that strip, a route on the API must NOT repeat "api" in
        # its own path. Swagger used to be mounted at "api/docs", which is why
        # /api/docs 404'd and only the double-prefixed /api/api/docs worked;
        # it is mounted at "docs" now, so the docs are at /api/docs as
        # expected.
        proxy_pass http://api:3001/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # optional: /api without trailing slash
    location = /api {
        return 301 /api/;
    }
}
