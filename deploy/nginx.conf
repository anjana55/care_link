server {
    listen 80;
    server_name _;          # or your domain

    # ---------- Public Next.js (root) ----------
    location / {
        proxy_pass http://public-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

# Staff / Internal Next.js
location /staff {
    proxy_pass http://web:3000/staff;          # no trailing slash here
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

    # ---------- NestJS API ----------
    location /api/ {
        # nginx's default body limit is 1MB, while the API accepts uploads up
        # to STORAGE_MAX_FILE_SIZE_BYTES (10MB). Without this, a caregiver
        # document over 1MB was rejected here with a bare 413 before it ever
        # reached the API - the same request sent straight to the API
        # succeeds. Kept above the API's own limit deliberately: nginx is the
        # outer gate, and the API re-validates size and MIME type itself, so
        # the tighter limit is enforced where the validation lives.
        client_max_body_size 12m;

        # Strip the /api prefix. This API sets no global prefix
        # (no setGlobalPrefix in apps/api/src/main.ts), so Nest serves its
        # routes at /locations, /auth/login, etc. Forwarding the prefix on
        # made every API call 404 - the browser saw "Cannot GET
        # /api/locations" while React Query swallowed it as empty data, so
        # the district/city dropdowns just rendered blank with no visible
        # error. The trailing slash on proxy_pass is what strips the prefix.
        proxy_pass http://api:3001/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # optional: /api without trailing slash
    location = /api {
        return 301 /api/;
    }
}
