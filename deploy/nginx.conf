server {
    listen 80;
    server_name _;          # or your domain

    # ---------- Public Next.js (root) ----------
    location / {
        proxy_pass http://public-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

# Staff / Internal Next.js
location /staff {
    proxy_pass http://web:3000/staff;          # no trailing slash here
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

    # ---------- NestJS API ----------
    location /api/ {
        # Important: decide whether you strip /api or keep it
        # Most NestJS apps expect the /api prefix to stay
        proxy_pass http://api:3001/api/;     # keep /api
        
        # OR if NestJS global prefix is empty and you want to strip:
        # proxy_pass http://api:3001/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # optional: /api without trailing slash
    location = /api {
        return 301 /api/;
    }
}
