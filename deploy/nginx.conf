# Single entry point for all three services, so the browser only ever
# talks to one origin - this is what makes CORS a non-issue for the two
# frontends (same-origin as the API, once proxied through here) and is
# also why NEXT_PUBLIC_API_URL in .env.production should be
# "https://yourdomain.example/api", not the api container's own address.
#
# This file is mounted read-only into the nginx container by
# docker-compose.prod.yml - edit it and `docker compose restart nginx`
# to pick up changes (no rebuild needed).
#
# TLS is NOT configured here - see DEPLOYMENT.md's "HTTPS" section. Once
# you have a certificate, add a `listen 443 ssl;` server block (or swap
# this whole file for Caddy, which provisions one for you automatically).

server {
    listen 80;
    server_name _;

    client_max_body_size 15m; # a little above STORAGE_MAX_FILE_SIZE_BYTES

    # 127.0.0.11 is Docker's own embedded DNS server on every
    # user-defined bridge network (which is what `docker compose` gives
    # you by default) - it's always there, nothing extra to configure.
    #
    # Combined with the `set $upstream_... ...; proxy_pass
    # http://$upstream_...;` pattern below (instead of a bare
    # `proxy_pass http://public-web:3000;`), this makes nginx resolve
    # each hostname *per request* instead of once at startup. A bare
    # proxy_pass resolves once when nginx boots and, if that single
    # resolution fails (e.g. the target container is still starting up
    # a couple of seconds after nginx does - normal at cold boot or
    # after a server reboot), nginx refuses to start at all rather than
    # retrying - which is exactly the "host not found in upstream"
    # crash this file used to hit. With the pattern below, a not-yet-
    # ready upstream just means a 502 on the very first request or two,
    # instead of nginx crash-looping.
    resolver 127.0.0.11 valid=10s;

    # Public patient/guardian app - caregiver search, registration, login.
    location / {
        set $upstream_public_web public-web:3000;
        proxy_pass http://$upstream_public_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff/caregiver app - already carries its own /staff basePath
    # (apps/web/next.config.js), so no path rewriting is needed here.
    location /staff/ {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NestJS API - /api/auth/login on the public host becomes /auth/login
    # against the api container, matching its routes (no /api prefix of
    # its own).
    location /api/ {
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
