# Plain-HTTP reverse proxy - the bootstrap/default config.
#
# This is what the nginx service serves until a certificate exists, and
# what it keeps serving if you never set up HTTPS. It is deliberately
# certificate-free so that nginx can ALWAYS start: `nginx.https.conf`
# cannot be loaded at all without a certificate on disk, so keeping an
# HTTP-only default is what lets setup.sh stand the stack up first and
# obtain the certificate second, in that order.
#
# setup.sh swaps in nginx.https.conf automatically once certbot has
# issued a certificate. To do that by hand, see DEPLOYMENT.md Part 13.
#
# The actual routing lives in deploy/proxy-locations.conf, shared with
# the TLS config so the two can't drift apart.

server {
    listen 80;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge. Served out of the shared
    # `certbot-webroot` volume, which the certbot service writes into.
    # This has to stay reachable over plain HTTP even in the TLS config,
    # where everything else redirects to HTTPS - renewal is answered on
    # port 80 by definition, so a blanket redirect would break renewals
    # every ~60 days. `^~` so this prefix wins over any regex location
    # that might otherwise match.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/proxy-locations.conf;
}
