# Production-shaped compose file - a starting point, not a drop-in-and-go
# deploy. Copy .env.production.example to .env.production, fill in every
# secret and URL, then:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See DEPLOYMENT.md for the full walkthrough (migrations, TLS, backups,
# secrets, and what this file deliberately leaves for you to plug in).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-care_platform}
      MYSQL_USER: ${MYSQL_USER:-care_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published to the host - only `api` needs to reach it, over
    # the compose network. Expose 3306 explicitly (e.g. for db:studio /
    # an ad-hoc mysqldump from your workstation) only over an SSH tunnel,
    # never by publishing the port directly on a public-facing host.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-care_app}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:-care_platform}
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env.production, e.g. https://yourdomain.example,https://yourdomain.example}
      CAREGIVER_WEB_URL: ${CAREGIVER_WEB_URL:?set CAREGIVER_WEB_URL in .env.production}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in .env.production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.production}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /storage/caregiver-documents
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # Optional: the app runs fine without these, but verification emails
      # only get logged (see `docker compose logs api`), never delivered,
      # until they're set - see DEPLOYMENT.md Part 8.4 and EmailService.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CareLink <no-reply@care-platform.local>}
      # Optional WhatsApp sign-in bootstrap values - see .env.production.example.
      # The feature itself is managed by an admin in the app (Settings).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-META_CLOUD}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-carelink_otp}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
    volumes:
      # Caregiver-uploaded documents (qualifications, ID scans, etc).
      # Persisted on a named volume, not the image, and must be part of
      # your backup routine alongside the database - see DEPLOYMENT.md.
      - caregiver-documents:/storage/caregiver-documents
    # No ports published directly - nginx is the only public entry point.
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env.production, e.g. https://yourdomain.example/api}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '3000'

  public-web:
    build:
      context: .
      dockerfile: apps/public-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - public-web
    ports:
      - '80:80'     # still needed: certbot's HTTP-01 renewal challenge
                     # is answered over plain HTTP, and the 80 server block
                     # is what redirects visitors to https.
      - '443:443'   # TLS terminates here, in this container.
    volumes:
      # Which config to serve. Defaults to the certificate-free HTTP one so
      # that nginx can ALWAYS start, even on a box that has never obtained a
      # certificate. setup.sh writes deploy/nginx.local.conf and sets
      # NGINX_CONF=./deploy/nginx.local.conf once certbot has issued one.
      # Note nginx.https.conf names the certificate in ssl_certificate, and
      # nginx refuses to start if that file is missing - which is the whole
      # reason the HTTP default exists.
      - ${NGINX_CONF:-./deploy/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # The proxying rules, shared by the HTTP and HTTPS configs so the two
      # cannot drift apart.
      - ./deploy/proxy-locations.conf:/etc/nginx/snippets/proxy-locations.conf:ro
      # The certificate certbot writes, read-only.
      - certbot-conf:/etc/letsencrypt:ro
      # The webroot the ACME challenge is served from. Shared with the
      # certbot service below; nginx's port-80 block serves it out of
      # /var/www/certbot. Needed in BOTH configs - renewal is answered over
      # plain HTTP, so the TLS config keeps a port-80 block for exactly this.
      - certbot-webroot:/var/www/certbot:ro
      # The landing page is a route in public-web now, so there is no static
      # site to mount here. See the note in proxy-locations.conf.

  # Obtains and renews the certificate. Deliberately NOT long-running - the
  # webroot plugin's renewal is a one-shot command, so this is invoked by
  # setup.sh (or by hand) rather than started with the rest of the stack.
  # Running it as a service with `restart: unless-stopped` would just exit 0
  # immediately and Docker would show it as a crashed container forever.
  # `profiles: ['tools']` keeps a plain `up -d` from trying.
  certbot:
    image: certbot/certbot:latest
    profiles: ['tools']
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      # Deliberately NO renewal hook mounted here. A hook runs INSIDE this
      # container, which has no docker CLI and no docker socket, so a hook
      # that tries to reload nginx dies with "docker: not found" (127). The
      # reload is chained onto the host side of the cron command instead -
      # see setup.sh's renewal step and DEPLOYMENT.md Part 13.4.

volumes:
  mysql-data:
  caregiver-documents:
  certbot-conf:      # the certificate and its private key - back this up
  certbot-webroot:   # ACME challenge files; disposable
